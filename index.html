<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mission: Zero - Randomized Misere Edition</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; min-height: 100vh; justify-content: center; }
        .viewport { position: relative; width: 800px; height: 600px; background: #2c3e50; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; pointer-events: none; }
        #svg-menu { pointer-events: all; z-index: 200; }
        #ui-controls { position: absolute; bottom: 30px; width: 100%; display: none; justify-content: center; gap: 15px; z-index: 100; }
        button { padding: 12px 25px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background: #3498db; color: white; font-weight: bold; transition: 0.2s; }
        button:hover:not(:disabled) { background: #2980b9; transform: scale(1.05); }
        button:disabled { background: #7f8c8d; opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="viewport">
        <object id="svg-bg" class="layer" data="background.svg" type="image/svg+xml"></object>
        <object id="svg-board" class="layer" data="board.svg" type="image/svg+xml"></object>
        <object id="svg-char" class="layer" data="character.svg" type="image/svg+xml"></object>
        <object id="svg-hud" class="layer" data="ui_feedback.svg" type="image/svg+xml"></object>
        <object id="svg-menu" class="layer" data="menu.svg" type="image/svg+xml"></object>
    </div>

    <div id="ui-controls">
        <button onclick="playMove(1)" id="btn-1">Take 1</button>
        <button onclick="playMove(2)" id="btn-2">Take 2</button>
        <button onclick="playMove(3)" id="btn-3">Take 3</button>
    </div>

    <script>
        let totalInitialBalls = 15;
        let count = 15; 
        let isPlayerTurn = false;

        function initGame(choice) {
            // Generate random balls between 9 and 21
            totalInitialBalls = Math.floor(Math.random() * (21 - 9 + 1)) + 9;
            count = totalInitialBalls;

            document.getElementById('svg-menu').style.display = 'none';
            document.getElementById('ui-controls').style.display = 'flex';
            
            setupBoard(); // Hide balls that are beyond our random count
            updateStatus("Mission Started!");
            
            if (choice === 'pc') {
                startCpuTurn();
            } else {
                startPlayerTurn();
            }
        }

        function setupBoard() {
            const boardDoc = document.getElementById('svg-board').contentDocument;
            // Hide any balls above our random starting number (up to max 21)
            for (let i = 21; i > count; i--) {
                const ball = boardDoc.getElementById('ball-' + i);
                if (ball) ball.style.display = 'none';
            }
        }

        function playMove(n) {
            if (!isPlayerTurn || n > count) return;
            executeMove(n);
            if (count > 0) {
                startCpuTurn();
            } else {
                endGame(true); // Player took the very last ball
            }
        }

        function startCpuTurn() {
            isPlayerTurn = false;
            toggleBtns(false);
            updateStatus("CPU thinking...");
            
            setTimeout(() => {
                // Optimal Misere Strategy: Target (count - 1) % 4 == 0
                let target = (count - 1) % 4;
                let take = (target === 0) ? 1 : target; 
                take = Math.min(take, count);
                
                executeMove(take);
                
                if (count > 0) {
                    startPlayerTurn();
                } else {
                    endGame(false); // CPU took the very last ball
                }
            }, 1200);
        }

        function startPlayerTurn() {
            isPlayerTurn = true;
            toggleBtns(true);
            updateStatus("Your Turn!");
            // Dynamic button disabling based on remaining balls
            if(count < 3) document.getElementById('btn-3').disabled = true;
            if(count < 2) document.getElementById('btn-2').disabled = true;
        }

        function executeMove(n) {
            const boardDoc = document.getElementById('svg-board').contentDocument;
            for (let i = 0; i < n; i++) {
                const ball = boardDoc.getElementById('ball-' + count);
                if (ball) ball.style.opacity = '0'; // Smooth fade
                count--;
            }
            updateHud();
        }

        function updateStatus(msg) {
            try {
                const hudDoc = document.getElementById('svg-hud').contentDocument;
                const txt = hudDoc.getElementById('status-txt');
                if(txt) txt.textContent = msg;
            } catch(e) {}
        }

        function updateHud() {
            try {
                const hudDoc = document.getElementById('svg-hud').contentDocument;
                const bar = hudDoc.getElementById('bar-grow');
                if(bar) {
                    const widthPercent = (count / totalInitialBalls) * 100;
                    bar.setAttribute('width', widthPercent + '%');
                }
            } catch(e) {}
        }

        function toggleBtns(on) {
            document.querySelectorAll('button').forEach(b => b.disabled = !on);
        }

        function endGame(playerTookLast) {
            document.getElementById('ui-controls').style.display = 'none';
            const msg = playerTookLast ? "GAME OVER: YOU LOST!" : "MISSION SUCCESS: YOU WON!";
            updateStatus(msg);
            alert(msg);
        }
    </script>
</body>
</html>
