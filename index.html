<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mission: Zero</title>
  <style>
    body {
      background: #1a1a1a;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    .viewport {
      position: relative;
      width: 800px;
      height: 600px;
      border-radius: 15px;
      overflow: hidden;
    }
    .layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #layer-bg       { z-index: 1; }
    #layer-board    { z-index: 2; }
    #layer-char     { z-index: 3; }
    #layer-hud      { z-index: 4; }
    #layer-menu     { z-index: 10; }
    #layer-gameover { z-index: 20; }

    #ui-controls {
      position: absolute;
      bottom: 28px;
      width: 100%;
      display: none;
      justify-content: center;
      gap: 16px;
      z-index: 15;
    }
    #ui-controls button {
      padding: 12px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      border: 2px solid #3498db;
      background: rgba(52,152,219,0.15);
      color: #7ecfff;
      letter-spacing: 1px;
      transition: background 0.15s, transform 0.1s;
    }
    #ui-controls button:hover:not(:disabled) {
      background: rgba(52,152,219,0.35);
      transform: translateY(-2px);
    }
    #ui-controls button:disabled {
      border-color: #555;
      color: #555;
      cursor: not-allowed;
      background: transparent;
    }
  </style>
</head>
<body>

<div class="viewport" id="viewport">

  <!-- BACKGROUND SVG -->
  <svg class="layer" id="layer-bg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="600" fill="#0f172a"/>
    <circle cx="100" cy="100" r="2" fill="white"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="500" r="1.5" fill="white"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="450" r="1" fill="white"><animate attributeName="opacity" values="1;0.1;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="80" r="1.5" fill="white"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="520" r="1" fill="white"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="200" r="1" fill="#7ecfff"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="300" r="1" fill="white"><animate attributeName="opacity" values="1;0.2;1" dur="6s" repeatCount="indefinite"/></circle>
  </svg>

  <!-- BOARD SVG — exactly 15 balls, 3 rows of 5 -->
  <svg class="layer" id="layer-board" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <rect x="60" y="140" width="680" height="280" rx="18"
          fill="rgba(255,255,255,0.04)" stroke="rgba(52,152,219,0.25)" stroke-width="1.5"/>
    <g id="ball-container">
      <!-- ROW 1: balls 1-5 -->
      <circle id="ball-1"  cx="160" cy="230" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-2"  cx="290" cy="230" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-3"  cx="400" cy="230" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-4"  cx="510" cy="230" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-5"  cx="640" cy="230" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <!-- ROW 2: balls 6-10 -->
      <circle id="ball-6"  cx="160" cy="310" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-7"  cx="290" cy="310" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-8"  cx="400" cy="310" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-9"  cx="510" cy="310" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-10" cx="640" cy="310" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <!-- ROW 3: balls 11-15 -->
      <circle id="ball-11" cx="160" cy="390" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-12" cx="290" cy="390" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-13" cx="400" cy="390" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-14" cx="510" cy="390" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
      <circle id="ball-15" cx="640" cy="390" r="28" fill="#3498db" stroke="#7ecfff" stroke-width="2"/>
    </g>
  </svg>

  <!-- CHARACTER SVG (your robot) -->
  <svg class="layer" id="layer-char" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <g id="robot" transform="translate(650,100)">
      <rect x="-40" y="-40" width="80" height="80" rx="10" fill="#8e44ad" stroke="#fff" stroke-width="3">
        <animate id="cpu-think" attributeName="fill" from="#8e44ad" to="#e74c3c" dur="0.5s" begin="indefinite" repeatCount="3"/>
      </rect>
      <circle cx="-15" cy="-10" r="5" fill="cyan"/>
      <circle cx="15"  cy="-10" r="5" fill="cyan"/>
      <animateTransform attributeName="transform" type="translate"
        values="650,100; 650,110; 650,100" dur="3s" repeatCount="indefinite"/>
    </g>
  </svg>

  <!-- UI FEEDBACK SVG (your original HUD + count + cpu flash) -->
  <svg class="layer" id="layer-hud" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <rect id="bar-bg"   x="250" y="20" width="300" height="20" rx="10" fill="#34495e"/>
    <rect id="bar-grow" x="250" y="20" width="300" height="20" rx="10" fill="#2ecc71"/>
    <text id="status-txt" x="400" y="75" font-family="Arial" font-size="24"
          fill="white" text-anchor="middle">Welcome, Agent</text>
    <text id="count-txt" x="400" y="100" font-family="Arial" font-size="14"
          fill="#7ecfff" text-anchor="middle" opacity="0.8">15 balls remaining</text>
    <text id="cpu-flash" x="400" y="122" font-family="Arial" font-size="13"
          fill="#e67e22" text-anchor="middle" opacity="0">CPU took …</text>
  </svg>

  <!-- MENU SVG -->
  <svg class="layer" id="layer-menu" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#34495e"/>
    <circle cx="80"  cy="60"  r="1.5" fill="white" opacity="0.5"/>
    <circle cx="720" cy="540" r="1"   fill="white" opacity="0.4"/>
    <circle cx="400" cy="30"  r="1"   fill="#7ecfff" opacity="0.6"/>

    <text x="400" y="155" font-family="Arial" font-size="46" font-weight="bold"
          fill="white" text-anchor="middle">MISSION: ZERO</text>
    <text x="400" y="200" font-family="Arial" font-size="16"
          fill="#bdc3c7" text-anchor="middle">A Mathematical Strategy Game</text>

    <rect x="220" y="225" width="360" height="85" rx="10"
          fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="400" y="252" font-family="Arial" font-size="13"
          fill="#ecf0f1" text-anchor="middle">Take 1, 2 or 3 balls per turn.</text>
    <text x="400" y="276" font-family="Arial" font-size="13"
          fill="#e74c3c" text-anchor="middle" font-weight="bold">The player who takes the LAST ball LOSES.</text>
    <text x="400" y="300" font-family="Arial" font-size="13"
          fill="#ecf0f1" text-anchor="middle">15 balls total — play optimally!</text>

    <text x="400" y="358" font-family="Arial" font-size="18"
          fill="#bdc3c7" text-anchor="middle">Who goes first?</text>

    <!-- ME button -->
    <g cursor="pointer" onclick="initGame('me')">
      <rect x="220" y="375" width="140" height="56" rx="12" fill="#2ecc71"/>
      <text x="290" y="410" font-family="Arial" font-size="22" font-weight="bold"
            fill="white" text-anchor="middle">ME</text>
    </g>

    <!-- CPU button -->
    <g cursor="pointer" onclick="initGame('pc')">
      <rect x="440" y="375" width="140" height="56" rx="12" fill="#e67e22"/>
      <text x="510" y="410" font-family="Arial" font-size="22" font-weight="bold"
            fill="white" text-anchor="middle">CPU</text>
    </g>
  </svg>

  <!-- GAME OVER SVG -->
  <svg class="layer" id="layer-gameover" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"
       style="display:none; cursor:pointer;" onclick="restartGame()">
    <rect width="100%" height="100%" fill="rgba(0,0,0,0.85)"/>
    <text id="game-over-title" x="400" y="230" font-family="Arial" font-size="64"
          fill="#e74c3c" text-anchor="middle" font-weight="bold">GAME OVER</text>
    <text id="game-over-result" x="400" y="295" font-family="Arial" font-size="21"
          fill="#bdc3c7" text-anchor="middle">—</text>

    <!-- PLAY AGAIN button -->
    <g cursor="pointer">
      <rect x="300" y="350" width="200" height="55" rx="12" fill="#3498db"/>
      <text x="400" y="384" font-family="Arial" font-size="19" font-weight="bold"
            fill="white" text-anchor="middle">▶  PLAY AGAIN</text>
      <rect x="300" y="350" width="200" height="55" rx="12"
            fill="none" stroke="white" stroke-width="1.5" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="400" y="460" font-family="Arial" font-size="14"
          fill="#7f8c8d" text-anchor="middle">click anywhere to restart</text>
  </svg>

  <!-- HTML buttons on top of everything -->
  <div id="ui-controls">
    <button id="btn-1" onclick="playMove(1)">Take 1</button>
    <button id="btn-2" onclick="playMove(2)">Take 2</button>
    <button id="btn-3" onclick="playMove(3)">Take 3</button>
  </div>

</div>

<script>
  const TOTAL_BALLS = 15;
  let count        = TOTAL_BALLS;
  let isPlayerTurn = false;
  let gameActive   = false;

  const boardSVG = document.getElementById('layer-board');
  const hudSVG   = document.getElementById('layer-hud');
  const menuSVG  = document.getElementById('layer-menu');
  const goSVG    = document.getElementById('layer-gameover');
  const controls = document.getElementById('ui-controls');

  function getBall(n)   { return boardSVG.getElementById('ball-' + n); }
  function getHud(id)   { return hudSVG.getElementById(id); }

  /* ── INIT ── */
  function initGame(who) {
    menuSVG.style.display = 'none';
    controls.style.display = 'flex';
    gameActive = true;
    updateHud();
    if (who === 'pc') cpuTurn();
    else              playerTurn();
  }

  /* ── PLAYER ── */
  function playerTurn() {
    isPlayerTurn = true;
    setStatus('Your Turn!');
    refreshBtns();
  }

  function playMove(n) {
    if (!isPlayerTurn || !gameActive || n > count) return;
    executeMove(n);
    if (count <= 0) endGame(true);   // player took last → LOSES
    else            cpuTurn();
  }

  /* ── CPU ── */
  function cpuTurn() {
    isPlayerTurn = false;
    setStatus('CPU thinking…');
    toggleBtns(false);
    const anim = document.getElementById('cpu-think');
    if (anim) anim.beginElement();

    setTimeout(() => {
      // Nim strategy: leave (count-1) % 4 === 0 for opponent
      let take = (count - 1) % 4;
      if (take === 0) take = 1;
      take = Math.min(take, count);

      const flash = getHud('cpu-flash');
      flash.textContent = 'CPU took ' + take + ' ball' + (take > 1 ? 's' : '');
      flash.setAttribute('opacity', '1');
      setTimeout(() => flash.setAttribute('opacity', '0'), 1600);

      executeMove(take);
      if (count <= 0) endGame(false);  // CPU took last → player WINS
      else            playerTurn();
    }, 1300);
  }

  /* ── EXECUTE MOVE — removes from highest ball index down ── */
  function executeMove(n) {
    for (let i = 0; i < n; i++) {
      const ball = getBall(count);
      if (ball) {
        ball.style.transition    = 'opacity 0.35s, transform 0.35s';
        ball.style.transformBox  = 'fill-box';
        ball.style.transformOrigin = 'center';
        ball.style.opacity       = '0';
        ball.style.transform     = 'scale(0.2)';
      }
      count--;
    }
    updateHud();
    refreshBtns();
  }

  /* ── HUD ── */
  function setStatus(msg) { getHud('status-txt').textContent = msg; }

  function updateHud() {
    const pct = count / TOTAL_BALLS;
    getHud('bar-grow').setAttribute('width', (pct * 300).toFixed(1));
    getHud('bar-grow').setAttribute('fill',
      count <= 1 ? '#e74c3c' : count <= 4 ? '#e67e22' : '#2ecc71');
    getHud('count-txt').textContent =
      count + ' ball' + (count !== 1 ? 's' : '') + ' remaining';
  }

  function refreshBtns() {
    document.getElementById('btn-1').disabled = !isPlayerTurn || count < 1;
    document.getElementById('btn-2').disabled = !isPlayerTurn || count < 2;
    document.getElementById('btn-3').disabled = !isPlayerTurn || count < 3;
  }

  function toggleBtns(on) {
    ['btn-1','btn-2','btn-3'].forEach(id =>
      document.getElementById(id).disabled = !on);
  }

  /* ── GAME OVER ── */
  function endGame(playerLost) {
    gameActive = false;
    isPlayerTurn = false;
    toggleBtns(false);
    controls.style.display = 'none';

    const title  = goSVG.getElementById('game-over-title');
    const result = goSVG.getElementById('game-over-result');

    if (playerLost) {
      title.textContent = 'YOU LOSE!';
      title.setAttribute('fill', '#e74c3c');
      result.textContent = 'You took the last ball. Mission failed.';
    } else {
      title.textContent = 'YOU WIN!';
      title.setAttribute('fill', '#2ecc71');
      result.textContent = 'CPU took the last ball. Mission complete!';
    }
    goSVG.style.display = 'block';
  }

  /* ── RESTART ── */
  function restartGame() {
    count = TOTAL_BALLS;
    isPlayerTurn = false;
    gameActive = false;

    for (let i = 1; i <= TOTAL_BALLS; i++) {
      const b = getBall(i);
      if (b) {
        b.style.opacity   = '1';
        b.style.transform = 'scale(1)';
      }
    }

    setStatus('Welcome, Agent');
    updateHud();
    getHud('cpu-flash').setAttribute('opacity', '0');

    goSVG.style.display    = 'none';
    menuSVG.style.display  = '';
    controls.style.display = 'none';
  }
</script>
</body>
</html>
