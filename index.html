<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mission: Zero - Fixed Edition</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .viewport { position: relative; width: 800px; height: 600px; margin-top: 20px; background: #2c3e50; border-radius: 15px; overflow: hidden; }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; pointer-events: none; }
        #svg-menu, #svg-gameover { pointer-events: all; z-index: 200; }
        #ui-controls { position: absolute; bottom: 30px; width: 100%; display: none; justify-content: center; gap: 15px; z-index: 100; }
        button { padding: 12px 25px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background: #3498db; color: white; font-weight: bold; }
        button:disabled { background: #7f8c8d; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="viewport">
        <object id="svg-bg" class="layer" data="background.svg" type="image/svg+xml"></object>
        <object id="svg-board" class="layer" data="board.svg" type="image/svg+xml"></object>
        <object id="svg-char" class="layer" data="character.svg" type="image/svg+xml"></object>
        <object id="svg-hud" class="layer" data="ui_feedback.svg" type="image/svg+xml"></object>
        <object id="svg-menu" class="layer" data="menu.svg" type="image/svg+xml"></object>
        <object id="svg-gameover" class="layer" data="game_over.svg" type="image/svg+xml" style="display: none;"></object>
    </div>

    <div id="ui-controls">
        <button id="btn-1" onclick="playMove(1)">Take 1</button>
        <button id="btn-2" onclick="playMove(2)">Take 2</button>
        <button id="btn-3" onclick="playMove(3)">Take 3</button>
    </div>

    <script>
        // BALLS CONST NUMBER
        const TOTAL_BALLS = 15; 
        let count = TOTAL_BALLS;
        let isPlayerTurn = false;

        function initGame(choice) {
            document.getElementById('svg-menu').style.display = 'none';
            document.getElementById('ui-controls').style.display = 'flex';
            
            if (choice === 'pc') {
                startCpuTurn();
            } else {
                startPlayerTurn();
            }
        }

        function playMove(n) {
            if (!isPlayerTurn || n > count) return;
            executeMove(n);
            if (count > 0) {
                startCpuTurn();
            } else {
                endGame(true); // Player took the last ball -> YOU LOSE
            }
        }

        function startCpuTurn() {
            isPlayerTurn = false;
            toggleBtns(false);
            updateStatus("CPU thinking...");
            
            setTimeout(() => {
                let target = (count - 1) % 4;
                let take = (target === 0) ? 1 : target; 
                executeMove(Math.min(take, count));
                
                if (count > 0) {
                    startPlayerTurn();
                } else {
                    endGame(false); // CPU took the last ball -> YOU WIN
                }
            }, 1200);
        }

        function startPlayerTurn() {
            isPlayerTurn = true;
            toggleBtns(true);
            updateStatus("Your Turn!");
            if (count < 3) document.getElementById('btn-3').disabled = true;
            if (count < 2) document.getElementById('btn-2').disabled = true;
        }

        function executeMove(n) {
            const boardDoc = document.getElementById('svg-board').contentDocument;
            for (let i = 0; i < n; i++) {
                const ball = boardDoc.getElementById('ball-' + count);
                if (ball) ball.style.display = 'none';
                count--;
            }
            updateHud();
        }

        function updateStatus(msg) {
            try {
                const hudDoc = document.getElementById('svg-hud').contentDocument;
                hudDoc.getElementById('status-txt').textContent = msg;
            } catch(e) {}
        }

        function updateHud() {
            try {
                const hudDoc = document.getElementById('svg-hud').contentDocument;
                const bar = hudDoc.getElementById('bar-grow');
                if (bar) bar.setAttribute('width', (count / TOTAL_BALLS) * 100 + '%');
            } catch(e) {}
        }

        function toggleBtns(on) {
            document.querySelectorAll('button').forEach(b => b.disabled = !on);
        }

        function endGame(playerLost) {
            document.getElementById('ui-controls').style.display = 'none';
            const goLayer = document.getElementById('svg-gameover');
            const goDoc = goLayer.contentDocument;
            
            // Fix Game Over SVG elements
            const title = goDoc.getElementById('game-over-title');
            const result = goDoc.getElementById('game-over-result');

            if (playerLost) {
                title.textContent = "YOU LOSE!";
                title.setAttribute("fill", "#e74c3c");
                result.textContent = "You took the last ball.";
            } else {
                title.textContent = "YOU WIN!";
                title.setAttribute("fill", "#2ecc71");
                result.textContent = "The CPU took the last ball.";
            }
            
            goLayer.style.display = 'block';
            // Click anywhere on Game Over to reload
            goLayer.onclick = () => location.reload();
        }
    </script>
</body>
</html>
