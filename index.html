<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mission: Zero - Master 1 Edition</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .viewport { position: relative; width: 800px; height: 600px; margin-top: 20px; background: #2c3e50; border-radius: 15px; overflow: hidden; }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        #ui-controls { position: absolute; bottom: 30px; width: 100%; display: none; justify-content: center; gap: 15px; z-index: 100; }
        button { padding: 12px 25px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background: #3498db; color: white; font-weight: bold; }
        button:disabled { background: #7f8c8d; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="viewport">
        <object id="svg-bg" class="layer" data="bg.svg" type="image/svg+xml"></object>
        <object id="svg-board" class="layer" data="board.svg" type="image/svg+xml"></object>
        <object id="svg-char" class="layer" data="character.svg" type="image/svg+xml"></object>
        <object id="svg-menu" class="layer" data="menu.svg" type="image/svg+xml" style="display: block;"></object>
        <object id="svg-hud" class="layer" data="hud.svg" type="image/svg+xml"></object>
    </div>

    <div id="ui-controls">
        <button onclick="playMove(1)">Take 1</button>
        <button onclick="playMove(2)">Take 2</button>
        <button onclick="playMove(3)">Take 3</button>
    </div>

    <script>
        let count = 15;
        let isPlayerTurn = false;

        // Triggered from inside menu.svg when user clicks "Me" or "PC"
        function initGame(choice) {
            const menuElement = document.getElementById('svg-menu');
            if (menuElement) menuElement.style.display = 'none';
            const boardElement = document.getElementById('svg-board');
            if (boardElement) boardElement.style.display = 'block';
            const hudElement = document.getElementById('svg-hud');
            if (hudElement) hudElement.style.display = 'block';
            document.getElementById('ui-controls').style.display = 'flex';
            
            if (choice === 'pc') {
                startCpuTurn();
            } else {
                startPlayerTurn();
            }
        }

        function playMove(n) {
            if (!isPlayerTurn || n > count) return;
            executeMove(n);
            if (count > 0) startCpuTurn();
        }

        function startCpuTurn() {
            isPlayerTurn = false;
            toggleBtns(false);
            updateStatus("CPU thinking...");
            
            // Trigger SMIL "Thinking" animation in character.svg
            document.getElementById('svg-char').contentDocument.getElementById('think-anim').beginElement();

            setTimeout(() => {
                let take = (count - 1) % 4 || 1;
                executeMove(take);
                if (count > 0) startPlayerTurn();
            }, 1500);
        }

        function startPlayerTurn() {
            isPlayerTurn = true;
            toggleBtns(true);
            updateStatus("Your Turn!");
        }

        function executeMove(n) {
            const board = document.getElementById('svg-board').contentDocument;
            for (let i = 0; i < n && count > 0; i++) {
                const ball = board.getElementById('ball-' + count);
                if (ball) ball.style.display = 'none'; // Could be replaced with a SMIL fade
                count--;
            }
            updateHud();
            if (count <= 0) endGame();
        }

        function updateStatus(msg) {
            document.getElementById('svg-hud').contentDocument.getElementById('status-txt').textContent = msg;
        }

        function updateHud() {
            const bar = document.getElementById('svg-hud').contentDocument.getElementById('bar-grow');
            bar.setAttribute('to', (count / 15) * 100 + '%');
            bar.beginElement();
        }

        function toggleBtns(on) {
            document.querySelectorAll('button').forEach(b => b.disabled = !on);
        }

        function endGame() {
            document.getElementById('ui-controls').style.display = 'none';
            updateStatus(isPlayerTurn ? "CPU WON!" : "YOU WON!");
        }
    </script>
</body>
</html>
