<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <text x="400" y="50" font-family="sans-serif" font-size="24" fill="white" text-anchor="middle">REMAINING POWER</text>
    <rect x="250" y="70" width="300" height="20" rx="10" fill="#333" />
    <rect id="progress-bar" x="250" y="70" width="300" height="20" rx="10" fill="#2ecc71">
        <animate id="bar-anim" attributeName="width" dur="0.5s" fill="freeze" begin="indefinite" />
    </rect>
</svg>
