<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="600" fill="rgba(0,0,0,0.85)" />
    <text id="result-text" x="400" y="300" font-family="sans-serif" font-size="60" fill="#f1c40f" text-anchor="middle" opacity="0">
        GAME OVER
        <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze" />
        <animateTransform attributeName="transform" type="scale" from="0.5" to="1" dur="0.5s" fill="freeze" />
    </text>
</svg>
