<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="rgba(0,0,0,0.85)" />
  <text id="game-over-title" x="400" y="250" font-family="Arial" font-size="60" fill="#e74c3c" text-anchor="middle" font-weight="bold">MISSION FAILED</text>
  <text id="game-over-result" x="400" y="320" font-family="Arial" font-size="30" fill="white" text-anchor="middle">You took the last ball!</text>
  <text x="400" y="550" font-family="Arial" font-size="18" fill="#bdc3c7" text-anchor="middle">Click to restart</text>
</svg>
