<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" id="game-svg">
    <rect width="100%" height="100%" fill="#2c3e50" />

    <g id="scene-intro">
        <text x="300" y="180" text-anchor="middle" fill="#ecf0f1" font-family="Arial" font-size="40" font-weight="bold">
            MISSION: ZERO
            <animate attributeName="opacity" values="0;1;0.8;1" dur="3s" repeatCount="indefinite" />
        </text>
        <text x="300" y="240" text-anchor="middle" fill="#bdc3c7" font-family="Arial" font-size="18">A Mathematical Strategy Game</text>
    </g>

    <g id="scene-game" visibility="hidden">
        <rect x="50" y="50" width="500" height="300" rx="15" fill="#ecf0f1" />
        
        <g id="dots-container" transform="translate(100, 100)">
            </g>

        <text id="game-status" x="300" y="280" text-anchor="middle" font-family="Arial" font-size="20" fill="#2c3e50">Ready?</text>
    </g>

    <g id="scene-over" visibility="hidden">
        <rect width="600" height="400" fill="rgba(0,0,0,0.8)" />
        <text id="end-message" x="300" y="200" text-anchor="middle" fill="#e74c3c" font-family="Arial" font-size="45" font-weight="bold">GAME OVER</text>
        <text x="300" y="260" text-anchor="middle" fill="white" font-family="Arial" font-size="18">Refresh the page to play again</text>
    </g>
</svg>
