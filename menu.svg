<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#34495e" />
  <text x="400" y="200" font-family="Arial" font-size="40" fill="white" text-anchor="middle">Who starts the mission?</text>
  
  <g cursor="pointer" onclick="window.parent.initGame('me')">
    <rect x="250" y="280" width="120" height="60" rx="10" fill="#2ecc71" />
    <text x="310" y="318" font-family="Arial" font-size="20" fill="white" text-anchor="middle">ME</text>
  </g>
  
  <g cursor="pointer" onclick="window.parent.initGame('pc')">
    <rect x="430" y="280" width="120" height="60" rx="10" fill="#e67e22" />
    <text x="490" y="318" font-family="Arial" font-size="20" fill="white" text-anchor="middle">PC</text>
  </g>
</svg>
